name: Build APK

# Berjalan otomatis setiap kali ada perubahan yang di-push,
# dan bisa juga dijalankan manual dari tab Actions.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Versi Flutter sengaja dikunci supaya hasil build selalu sama.
      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      # repo.maven.apache.org kadang membalas 403 Forbidden untuk
      # permintaan dari runner GitHub, biasanya karena pembatasan lalu
      # lintas. Init script ini menukar alamatnya ke mirror resmi yang
      # dihosting Google. Isinya sama persis, hanya beda tempat.
      #
      # Init script dipakai, bukan mengubah build.gradle, karena yang
      # gagal justru build bawaan Flutter sendiri (:gradle), yang
      # berada di dalam folder SDK dan tidak bisa kita sentuh.
      - name: Pasang mirror Maven Central
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/init.gradle" <<'EOF'
          def MIRROR = 'https://maven-central.storage-download.googleapis.com/maven2/'

          def tukarCentral = { repos ->
              try {
                  def perluTukar = repos.any { r ->
                      r.hasProperty('url') && r.url != null &&
                      r.url.toString().startsWith('https://repo.maven.apache.org')
                  }
                  if (perluTukar) {
                      repos.removeAll { r ->
                          r.hasProperty('url') && r.url != null &&
                          r.url.toString().startsWith('https://repo.maven.apache.org')
                      }
                      repos.maven { url MIRROR }
                  }
              } catch (Exception diabaikan) {
                  // Kalau bentuk repositori tidak dikenali, biarkan apa adanya.
              }
          }

          beforeSettings { settings ->
              try { tukarCentral(settings.pluginManagement.repositories) } catch (Exception e) { }
              try { tukarCentral(settings.dependencyResolutionManagement.repositories) } catch (Exception e) { }
          }

          // afterProject, bukan beforeProject: repositori baru terdaftar
          // setelah build.gradle proyek itu selesai dievaluasi.
          afterProject { project ->
              tukarCentral(project.repositories)
          }
          EOF
          echo "--- init.gradle terpasang ---"
          head -3 "$HOME/.gradle/init.gradle"

      - name: Simpan sementara berkas proyek
        run: |
          mkdir -p /tmp/simpan
          cp -r lib /tmp/simpan/
          cp pubspec.yaml /tmp/simpan/

      # Kerangka folder android/ dibuat otomatis oleh Flutter,
      # jadi tidak perlu disimpan di repo.
      - name: Buat kerangka proyek Android
        run: flutter create . --project-name laundry_pos --org id.laundry --platforms=android

      - name: Kembalikan berkas proyek
        run: |
          rm -rf lib test
          cp -r /tmp/simpan/lib .
          cp /tmp/simpan/pubspec.yaml .
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          # MainActivity buatan sendiri: menyediakan jalan membuka Setelan
          # Bluetooth langsung dari aplikasi.
          KT=$(find android/app/src/main/kotlin -name MainActivity.kt | head -1)
          if [ -n "$KT" ]; then
            cp android_overrides/MainActivity.kt "$KT"
            echo "MainActivity.kt dipasang di $KT"
          else
            echo "PERINGATAN: MainActivity.kt bawaan tidak ditemukan"
          fi

      # Tambalan HARUS diletakkan di ATAS android/build.gradle.
      # Kalau ditaruh di bawah, Gradle menolak dengan pesan
      # "Cannot run Project.afterEvaluate(Closure) when the project
      # is already evaluated", karena Flutter memanggil
      # evaluationDependsOn(':app') di akhir berkas yang sama.
      - name: Tambal namespace plugin lama
        run: |
          cp android/build.gradle /tmp/build.gradle.asli
          cat android_overrides/namespace_patch.gradle /tmp/build.gradle.asli > android/build.gradle
          echo "--- 8 baris pertama android/build.gradle ---"
          head -8 android/build.gradle

      - name: Ambil dependensi
        run: flutter pub get

      # Diulang sampai tiga kali. Kegagalan unduh dari repositori
      # publik sering hanya sesaat, dan mengulang jauh lebih murah
      # daripada menjalankan ulang seluruh workflow.
      - name: Build APK release
        run: |
          for i in 1 2 3; do
            echo "=== Percobaan build ke-$i ==="
            if flutter build apk --release; then
              exit 0
            fi
            echo "Gagal. Menunggu 20 detik sebelum mencoba lagi..."
            sleep 20
          done
          echo "Build tetap gagal setelah 3 percobaan."
          exit 1

      - name: Ganti nama APK
        run: |
          mkdir -p keluaran
          cp build/app/outputs/flutter-apk/app-release.apk keluaran/kasir-laundry.apk
          ls -lh keluaran/

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: kasir-laundry-apk
          path: keluaran/kasir-laundry.apk
          if-no-files-found: error
          retention-days: 90
